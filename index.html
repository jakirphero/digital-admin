<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Connection Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f1f5f9;
    padding:20px;
}

.box{
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    margin-bottom:15px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#0f766e;
    color:white;
    font-size:16px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    padding:15px;
    background:#f8fafc;
    border-radius:8px;
    white-space:pre-wrap;
    word-break:break-word;
}

.success{
    color:#166534;
    background:#dcfce7!important;
}

.error{
    color:#b91c1c;
    background:#fee2e2!important;
}
</style>
</head>

<body>

<div class="box">

    <h2>🔌 Supabase Connection Test</h2>

    <p>নিচের বাটনে চাপ দিন।</p>

    <br>

    <button onclick="testConnection()">
        Test Supabase Connection
    </button>

    <div id="result">
        Result এখানে দেখাবে...
    </div>

</div>

<script>

const SUPABASE_URL =
"https://mulroqtysdawvwdrpdxt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-v7fU5dwzz0LddbM-f87PQ_-L1BH-bl";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function testConnection(){

    const result =
        document.getElementById("result");

    result.className = "";
    result.textContent =
        "⏳ Supabase server-এর সাথে যোগাযোগ করা হচ্ছে...";


    try{

        /*
         * প্রথমে Supabase Auth endpoint পরীক্ষা
         */

        const response =
            await fetch(
                SUPABASE_URL + "/auth/v1/settings",
                {
                    method:"GET",
                    headers:{
                        "apikey":SUPABASE_KEY
                    }
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            result.className = "error";

            result.textContent =
                "❌ Supabase response error\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\n" +
                text;

            return;
        }


        result.className = "success";

        result.textContent =
            "✅ Supabase Server Connection সফল!\n\n" +
            "Project URL ঠিক আছে।\n" +
            "API Key গ্রহণ করা হয়েছে।\n\n" +
            "HTTP Status: " +
            response.status +
            "\n\n" +
            "এখন সমস্যা হলে সেটা Admin Login/Auth অথবা Database/RLS-এ হতে পারে।";


    }catch(error){

        console.error(error);

        result.className = "error";

        result.textContent =
            "❌ Supabase Server-এর সাথে সংযোগ হচ্ছে না।\n\n" +
            "Error:\n" +
            error.message +
            "\n\n" +
            "সম্ভাব্য কারণ:\n" +
            "1. Internet connection সমস্যা\n" +
            "2. Supabase Project URL ভুল\n" +
            "3. Supabase project pause/সমস্যা\n" +
            "4. Browser/network Supabase request block করছে\n" +
            "5. API endpoint-এ পৌঁছানো যাচ্ছে না";
    }

}

</script>

</body>
</html>
